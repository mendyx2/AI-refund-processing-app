services:
  db-seed:
    build: ./backend
    command: ["npm", "run", "db:reset"]
    environment:
      DATABASE_URL: file:/app/db/app.db
    volumes:
      - sqlite-data:/app/db
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: file:/app/db/app.db
      CORS_ORIGINS: http://localhost:3000
      # Optional: without it, judgment-call requests are escalated to a human.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - sqlite-data:/app/db
    depends_on:
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
